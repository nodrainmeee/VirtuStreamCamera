
name: Build VirtuStream Camera (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: virtustream-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Compile application preview
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Corrige le problème MSBuild non reconnu
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Show toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --version
          msbuild -version

      # Vérification de la structure du projet
      - name: Verify project files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'CMakeLists.txt',
            'app/CMakeLists.txt',
            'app/src/main.cpp',
            'README.md',
            'NOTICE.txt',
            'docs',
            'drivers'
          )

          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Missing project file or folder: $item"
            }
          }

      # Configuration CMake en 64 bits
      - name: Configure x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake -S . -B out/build-ci `
            -G "Visual Studio 17 2022" `
            -A x64

      # Compilation native C++
      - name: Compile application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          cmake --build out/build-ci `
            --config Release `
            --parallel 2

      # Préparation des fichiers téléchargeables
      - name: Prepare downloadable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem -Path 'out/build-ci' `
            -Filter 'VirtuStreamCamera.exe' `
            -Recurse -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host 'Build tree:'
            Get-ChildItem -Path 'out/build-ci' -Recurse |
              Select-Object -ExpandProperty FullName

            throw 'VirtuStreamCamera.exe was not produced.'
          }

          $stage = Join-Path $PWD 'package/VirtuStreamCamera-preview'

          New-Item -ItemType Directory -Force `
            -Path $stage | Out-Null

          New-Item -ItemType Directory -Force `
            -Path (Join-Path $stage 'docs') | Out-Null

          New-Item -ItemType Directory -Force `
            -Path (Join-Path $stage 'drivers') | Out-Null

          Copy-Item -LiteralPath $exe.FullName `
            -Destination (Join-Path $stage 'VirtuStreamCamera.exe')

          Copy-Item -LiteralPath 'README.md' `
            -Destination $stage

          Copy-Item -LiteralPath 'NOTICE.txt' `
            -Destination $stage

          Copy-Item -Path 'docs/*' `
            -Destination (Join-Path $stage 'docs') `
            -Recurse

          Copy-Item -Path 'drivers/*' `
            -Destination (Join-Path $stage 'drivers') `
            -Recurse

          if (Test-Path -LiteralPath 'assets') {
            New-Item -ItemType Directory -Force `
              -Path (Join-Path $stage 'assets') | Out-Null

            $assetItems = Get-ChildItem -LiteralPath 'assets' -Force

            if ($assetItems) {
              Copy-Item -Path 'assets/*' `
                -Destination (Join-Path $stage 'assets') `
                -Recurse
            }
          }

          @'
          VirtuStream Camera 0.1.0
          Windows x64 application preview.

          This build does NOT include a Windows virtual camera driver.
          This build does NOT include a Windows virtual microphone driver.

          Native driver development, signing, installation and hardware
          compatibility testing are still pending.
          '@ | Set-Content -Encoding UTF8 `
            (Join-Path $stage 'BUILD-STATUS.txt')

          Write-Host "Packaged executable: $($exe.FullName)"

          Get-ChildItem -Path $stage -Recurse -File |
            Select-Object FullName, Length

      # Publication de l'artefact
      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v7
        with:
          name: VirtuStreamCamera-preview-win-x64
          path: package/VirtuStreamCamera-preview/
          if-no-files-found: error
          retention-days: 14
